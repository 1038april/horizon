[package]
name = "horizon-narrator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "The narrator: vanilla's text-to-speech (GameNarrator, com.mojang.text2speech) and screen narration state"

[dependencies]
log = "0.4"

# NarratorWindows: SAPI's SpVoice over COM, the voice the Windows narrator settings pick.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Speech", "Win32_System_Com"] }

[lints]
workspace = true
